name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only reads the repository.
permissions:
  contents: read

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Python worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true # keyed on uv.lock

      # Python version comes from .python-version.
      - run: uv sync --frozen

      - run: npm run lint:worker
      - run: npm run test:worker
      - run: uv run arch-competition-ops doctor
      - run: uv run arch-competition-ops verify

  web:
    name: Web and storage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint:web
      - run: npm run test:storage
      - run: npm run test:web
      - run: npm run test:tools
      - run: npm run build:web
      # After the build on purpose: apps/web/next-env.d.ts is gitignored and generated by Next.js,
      # and the web type check needs it.
      - run: npm run typecheck

  windows-scripts:
    name: Windows scripts
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Scheduled-task scripts run under Windows PowerShell 5.1 and pwsh 7, plus the dev-port test.
      # These tests only use Node built-ins, so no npm ci is needed (test:tools needs it, so it is not run here).
      - run: npm run test:scripts
