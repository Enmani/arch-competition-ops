sources:
  - source_id: ted_design_notices
    name: TED Design and Procurement Notices
    kind: official_procurement
    jurisdiction: eu
    base_url: https://ted.europa.eu/
    collector: ted_search_api
    scan_method: api
    extractor: ted_notice_parser
    source_tier: primary
    priority: 1.0
    enabled: true
    regions:
      - europe
    languages:
      - en
      - fr
      - de
      - it
      - es
    notes: Primary source for EU-level design contests and design service procurement notices.

  - source_id: world_bank_procurement_notices
    name: World Bank Procurement Notices
    kind: official_procurement
    jurisdiction: global
    base_url: https://projects.worldbank.org/en/projects-operations/procurement
    collector: world_bank_procnotices
    scan_method: api
    extractor: generic_listing_html
    source_tier: primary
    priority: 0.86
    enabled: true
    regions:
      - global
    languages:
      - en
      - fr
      - es
      - pt
    notes: World Bank-financed consulting-services invitations (requests for expressions of interest) from the procnotices API; awards and goods/works bids are skipped. Many are open to international firms; the market approach (national or international) is in the raw notice.

  - source_id: ungm_public_notices
    name: UN Global Marketplace Procurement Notices
    kind: official_procurement
    jurisdiction: global
    base_url: https://www.ungm.org/Public/Notice
    collector: ungm_notice_search
    scan_method: html
    extractor: generic_listing_html
    source_tier: primary
    priority: 0.8
    enabled: false
    regions:
      - global
    languages:
      - en
      - fr
      - es
      - ar
    notes: Open notices of 32 UN organisations (UNOPS, UNDP, UN-Habitat, UNRWA, UNHCR, UNICEF...) read from the public notice list, no login. No procurement-code filter is applied. Kept disabled because the UNGM terms (section 5) bar storing or republishing its material in another retrieval system without written permission from registry@ungm.org; set enabled to true once that is granted.

  - source_id: isdb_project_tenders
    name: Islamic Development Bank Project Tenders
    kind: official_procurement
    jurisdiction: global
    base_url: https://www.isdb.org/project-procurement/tenders
    collector: isdb_tender_list
    scan_method: html
    extractor: generic_listing_html
    source_tier: primary
    priority: 0.7
    enabled: true
    regions:
      - global
    languages:
      - en
      - fr
      - ar
    notes: Open tenders, prequalifications, expressions of interest and general procurement notices of IsDB-financed projects in its member countries, from the public tender list (about 35 open, a few design-related). The list has no publication date, so the whole open list is read each run.

  - source_id: competitions_archi
    name: Competitions.archi
    kind: aggregator
    jurisdiction: global
    base_url: https://competitions.archi/
    collector: competitions_archi_feed
    scan_method: html
    extractor: generic_listing_html
    source_tier: secondary
    priority: 0.62
    enabled: true
    regions:
      - global
    languages:
      - en
    notes: Secondary discovery only. Must not override official procurement facts.

  - source_id: bustler_competitions
    name: Bustler Competitions
    kind: media
    jurisdiction: global
    base_url: https://bustler.net/competitions
    collector: disabled_scaffold
    scan_method: html
    extractor: generic_listing_html
    source_tier: tertiary
    priority: 0.45
    enabled: false
    regions:
      - global
    languages:
      - en
    notes: Low-trust media discovery surface. Useful for backfill only.
