[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "arch-competition-ops"
version = "0.1.0"
description = "Local-first architecture competition discovery and verification workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11.0,<3",
  "pydantic-settings>=2.6.0,<3",
  "PyYAML>=6.0.2,<7",
  "requests>=2.32.0,<3",
]

[project.optional-dependencies]
browser = [
  "crawlee[playwright]>=1.6.0,<2",
  "playwright>=1.52.0,<2",
]

[project.scripts]
arch-competition-ops = "arch_competition_ops.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9",
  "ruff>=0.11.0,<0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/worker/src/arch_competition_ops"]

# The procedure-type registry is shared with the Web app, so its source of truth stays in config/.
# The wheel gets a copy that normalizers.competition falls back to outside a checkout.
[tool.hatch.build.targets.wheel.force-include]
"config/procedure-type-registry.json" = "arch_competition_ops/_bundled/procedure-type-registry.json"

[tool.pytest.ini_options]
pythonpath = ["apps/worker/src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "RUF100"]

[tool.ruff.lint.isort]
known-first-party = ["arch_competition_ops"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures embed real-world notice titles, URLs and HTML/JSON payloads verbatim; wrapping
# them would change what is being tested. Source code is held to the 100 column limit.
"apps/worker/tests/**" = ["E501"]
